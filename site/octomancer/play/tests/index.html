<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Octomancer tests</title>
<style>
  body { background:#0a1c2a; color:#baffea; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 16px; }
  #result { white-space: pre-wrap; }
  .pass { color:#7CFC9A; }
  .fail { color:#ff8a8a; }
</style>
</head>
<body>
<h3>Octomancer play tests</h3>
<div id="result">running…</div>
<script type="module">
import { createLoop, STEP } from '../js/loop.js';

const results = [];
function assert(name, cond) {
  results.push({ name, pass: !!cond });
}
function approx(a, b, eps = 1e-6) { return Math.abs(a - b) <= eps; }

// --- loop.js: fixed-step accumulator ---
{
  let steps = 0;
  const loop = createLoop(() => { steps++; }, () => {});
  loop.manualStep(50);
  assert('manualStep(50) runs the step fn 50 times', steps === 50);
  assert('STEP is 0.02s (50Hz)', approx(STEP, 0.02));
}

// --- loop.js: metrics shape ---
{
  const loop = createLoop(() => {}, () => {});
  loop.manualStep(10);
  const m = loop.metrics();
  assert('metrics().stepCount tracks manualStep', m.stepCount === 10);
  assert('metrics() has frameMsMedian/P95 fields', typeof m.frameMsMedian === 'number' && typeof m.frameMsP95 === 'number');
}

// --- 50 steps == 1.000s of simulated time ---
{
  let time = 0;
  const loop = createLoop((dt) => { time += dt; }, () => {});
  loop.manualStep(50);
  assert('50 steps advance exactly 1.000s', approx(time, 1.0, 1e-9));
}

// --- input.js: keyboard vector normalisation ---
import { createInput } from '../js/input.js';
{
  const input = createInput();
  input.setOverride({ move: { x: 1, y: 0 }, dash: true, bomb: false, pause: false });
  const snap = input.snapshot();
  assert('override move.x passes through', snap.move.x === 1);
  assert('override dash pressed', snap.dash.held === true);
  input.setOverride(null);
}

// --- input.js: default state is neutral ---
{
  const input = createInput();
  const snap = input.snapshot();
  assert('default move is {0,0}', snap.move.x === 0 && snap.move.y === 0);
  assert('default dash not held', snap.dash.held === false);
}

// --- M1 swim tests (octopus.js / physics.js) ---
import { runSwimTests } from './swim.test.js';
runSwimTests(assert, approx);

// --- M2 world generator tests (gen.js) ---
import { runGenTests } from './gen.test.js';
runGenTests(assert, approx);

// --- M3 enemy/health/bomb tests (enemies.js / octopus.js / bomb.js) ---
import { runEnemyTests } from './enemies.test.js';
runEnemyTests(assert, approx);

// --- M4 score + best-save tests (score.js / save.js) ---
import { runScoreTests } from './score.test.js';
runScoreTests(assert, approx);

// --- Alive-pass wall critter tests (decor.js) ---
import { runDecorTests } from './decor.test.js';
runDecorTests(assert, approx);

// --- Round-6 task 2: concave-corner collision escape tests (physics.js) ---
import { runCornerTests } from './corner.test.js';
runCornerTests(assert, approx);

// --- 2026-10-08: the movement test room (data/movement-test.json, ?movetest=1): sweep, rest-and-leave and the tour at
// 30/60/120 Hz, no dash. Must stay green after ANY change to swimming, collision, the wall outline or block pushing ---
import { runMovementTests } from './movement.test.js';
await runMovementTests(assert);

// --- Round-8 task 1/3: wall-outline trace closure + collision-matches-rim
// tests (outline.js / world.js / physics.js) ---
import { runOutlineTests } from './outline.test.js';
runOutlineTests(assert, approx);

// --- Round-9 task 1: chunk-seam outline-cache invalidation regression
// guard (world.js's ensureNext/getWallOutline) ---
import { runWorldTests } from './world.test.js';
runWorldTests(assert, approx);

// --- v2 room bank (rooms.js, M1-2) and level generator (level.js, M1-3);
// not wired into the running game yet ---
import { runRoomTests } from './rooms.test.js';
await runRoomTests(assert, approx);
import { runLevelTests } from './level.test.js';
await runLevelTests(assert, approx);

// --- v2 single-level world, band wall cache and spawn adapter (M1-4/M1-5); the spawn adapter reads the
// pattern table (round 30), which main.js registers in the game ---
import { registerPatternTable } from './patterns.test.js';
await registerPatternTable();
import { runWorldV2Tests } from './world-v2.test.js';
await runWorldV2Tests(assert, approx);

// --- Biome 1 scaffolding (V2-PLAN section 10): run flow, room bank, authored
// hub / tutorial, journal ---
import { runRunTests } from './run.test.js';
runRunTests(assert, approx);
import { runBiome1Tests } from './biome1.test.js';
await runBiome1Tests(assert, approx);
import { runAuthoredTests } from './authored.test.js';
await runAuthoredTests(assert, approx);
import { runJournalTests } from './journal.test.js';
await runJournalTests(assert, approx);

// --- Round 22: A* reachability, bot runs, quests, shops, shells ---
import { runPathcheckTests } from './pathcheck.test.js';
await runPathcheckTests(assert, approx);
import { runQuestTests } from './quests.test.js';
await runQuestTests(assert, approx);

// --- Round 24: generated Shallows art ---
import { runV2ArtTests } from './v2-art.test.js';
await runV2ArtTests(assert, approx);

// --- Round 30: pattern spawning and the five hazards ---
import { runPatternTests } from './patterns.test.js';
await runPatternTests(assert);
import { runHazardTests } from './hazards.test.js';
await runHazardTests(assert);

// --- Round 31: loot and secrets, and the idle-at-start safety check ---
import { runLootTests } from './loot.test.js';
await runLootTests(assert);

// --- Round 32: carried items and the round-31 review fixes ---
import { runItemTests } from './items.test.js';
await runItemTests(assert);

// --- Round 33: run loop and meta (summary screens, best runs, hub shortcut, stats page) ---
import { runMetaTests } from './meta.test.js';
await runMetaTests(assert);

// --- Round 34: physics props (bombs, loot, falling rocks and rubble as rigid bodies) ---
import { runPropsTests } from './props.test.js';
await runPropsTests(assert);

// --- Pushable blocks (props.js PK_BLOCK, blocks-draw.js, block spawns) ---
import { runBlocksTests } from './blocks.test.js';
await runBlocksTests(assert);

// --- Round 35: enemy patterns, QA-ENEMIES regressions, round-34 review fixes ---
import { runEnemyR35Tests } from './enemies-r35.test.js';
await runEnemyR35Tests(assert);

// --- Round 36: round-35 review fixes (patrol pins, pocket crack, boulder, ghost, lunge overlap) ---
import { runEnemyR36Tests } from './enemies-r36.test.js';
await runEnemyR36Tests(assert);

// --- Round 36: level detail (dense rooms, 2x props and decor, set pieces) ---
import { runDetailTests } from './detail.test.js';
await runDetailTests(assert);

// --- Round 46: foliage from the original's FoliageItems (kinds, offsets, rims, no twins) ---
import { runFoliageTests } from './foliage.test.js';
await runFoliageTests(assert);

// --- Round 37: set pieces force their content, seeding fix ---
import { runSetPieceTests } from './setpieces.test.js';
await runSetPieceTests(assert);
import { runPoolTests } from './pool.test.js';
await runPoolTests(assert);

// --- Round 37: game feel (sink, dash recoil, squash, shake) ---
import { runFeelTests } from './feel.test.js';
import { runSettingsTests } from './settings.test.js';
runFeelTests(assert);

// --- Round 38: settings menu, seed override, shop room, shake / puff / shadow fixes ---
await runSettingsTests(assert);

// --- Round 43: off-screen culling, canvas pool, staged level build ---
import { runPerf43Tests } from './perf43.test.js';
await runPerf43Tests(assert);

// --- Round 44: portal states, seating, tint, the two sheets ---
import { runPortalTests } from './portal.test.js';
await runPortalTests(assert);
// --- Materials: material ids, draw order at boundaries, bedrock vs bombs, seams ---
import { runMaterialsTests } from './materials.test.js';
{
  const { createRoomBank } = await import('../js/rooms.js');
  const res = await fetch('../data/biome1-rooms.json');
  await runMaterialsTests(assert, createRoomBank(await res.json()));
}

// --- 2026-10-07: destructible shop, buff shopkeeper, Spelunky aggro ---
import { runShopTests } from './shop.test.js';
await runShopTests(assert);
// --- Buried treasure and the Sea-glass Goggles ---
import { runEmbedTests } from './embed.test.js';
await runEmbedTests(assert);

// --- Section 14: fish juice, Ink Cloud, the ink jet, the hotbar and inventory, the new controls ---
import { runSpellTests } from './spells.test.js';
await runSpellTests(assert);
import { runInkJetTests } from './inkjet.test.js';
runInkJetTests(assert);
import { runHotbarTests } from './hotbar.test.js';
await runHotbarTests(assert);
import { runRestTests } from './rest.test.js';
await runRestTests(assert);
// --- V2-PLAN 16: corpses and currency shells by value ---
import { runCorpseTests } from './corpses.test.js';
await runCorpseTests(assert);
import { runShellTests } from './shells.test.js';
await runShellTests(assert);

// --- V2-PLAN 16: giant clam and tentacle ---
import { runCreatureTests } from './creatures.test.js';
await runCreatureTests(assert);

// --- V2-PLAN 16: traps and the octopus's death looks (impale, stun, jets up, jet+spikes, splat) ---
import { runDamageTests } from './damage.test.js';
await runDamageTests(assert);

// --- V2-PLAN 16 point 5: friendly NPCs are killable and aggroable ---
import { runNpcTests } from './npcs.test.js';
await runNpcTests(assert);

// --- 2026-10-08: unified creature rules (one creature table, one damage entry) ---
import { runCreatureRulesTests } from './creature-rules.test.js';
await runCreatureRulesTests(assert);

// --- V2-PLAN 14: the death ragdoll (limp body as a prop, enemies keep attacking it, the death camera) ---
import { runRagdollTests } from './ragdoll.test.js';
await runRagdollTests(assert);

// --- 2026-10-08: time pressure (the Beholder as the Spelunky ghost) and the Swift Current bonus ---
import { runTimePressureTests } from './timepressure.test.js';
await runTimePressureTests(assert);

const pass = results.filter(r => r.pass).length;
const total = results.length;
const lines = results.map(r => `${r.pass ? 'PASS' : 'FAIL'} ${r.name}`);
lines.push('');
lines.push(pass === total ? `PASS ${pass}/${total}` : `FAIL ${pass}/${total}`);
document.getElementById('result').textContent = lines.join('\n');
document.getElementById('result').className = pass === total ? 'pass' : 'fail';
</script>
</body>
</html>
