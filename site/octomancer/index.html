<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octomancer | Raccoon Website</title>
  <meta name="description" content="The Octomancer title screen. Octomancer is being rebuilt as a small browser game and isn't playable yet — see Information for the story so far, or head back to the games list.">
  <meta property="og:title" content="Octomancer">
  <meta property="og:description" content="The Octomancer title screen. Octomancer is being rebuilt as a small browser game and isn't playable yet — see Information for the story so far, or head back to the games list.">
  <meta property="og:image" content="https://raccoon.website/img/octomancer/cave-bg.webp">
  <meta property="og:url" content="https://raccoon.website/octomancer/">
  <meta property="og:type" content="website">
  <link rel="icon" href="/racc-light.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans&family=Quicksand:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    /* Octomancer's own title screen: Milan Švancara's layered cave art, drifting, behind a two-item menu. */
    html, body {
      height: 100%;
      overflow: hidden;
      background: rgba(8, 18, 20, 1);
    }
    body {
      height: 100dvh;
    }

    /* ---------- Parallax scene ---------- */

    .octo-scene-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: rgba(8, 18, 20, 1);
      z-index: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .octo-scene-wrap.is-ready { opacity: 1; }

    /* The cave art is drawn into one screen-sized canvas (see the script at the bottom). Animating 22
       full-size DOM layers made Chromium run out of GPU memory, which showed as flashing. */
    .octo-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* ---------- Loading veil ---------- */

    .octo-loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: rgba(8, 18, 20, 1);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .octo-loading.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .octo-spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(209, 218, 223, 0.25);
      border-top-color: #d1dadf;
      animation: octo-spin 0.9s linear infinite;
    }
    @keyframes octo-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .octo-spinner { animation-duration: 1.8s; }
    }

    /* ---------- Menu ---------- */

    .octo-menu-wrap {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
    }

    .octo-title {
      font-family: 'Josefin Sans', var(--font-head, sans-serif);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #d1dadf;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      margin: 0 0 12px;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
      opacity: 0.92;
    }

    .octo-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px 44px;
    }

    .octo-menu-item {
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: max(min(max(3vh, 3vw), 25px), 15px);
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      transition: text-shadow 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .octo-menu-item:hover,
    .octo-menu-item:focus-visible {
      color: #d1dadf;
      text-decoration: none;
      text-shadow: 0 0 18px rgba(158, 178, 189, 0.85), 0 0 36px rgba(158, 178, 189, 0.5);
      transform: scale(1.05);
    }
    .octo-menu-item:focus-visible {
      outline: 2px solid #9eb2bd;
      outline-offset: 6px;
    }
    .octo-menu-item:active { transform: scale(0.98); }

    .octo-menu-item.is-disabled {
      position: relative;
      opacity: 0.35;
      cursor: default;
      background: none;
      border: none;
      appearance: none;
    }
    .octo-menu-item.is-disabled:hover,
    .octo-menu-item.is-disabled:focus-visible {
      color: #fff;
      text-shadow: none;
      transform: none;
      outline: none;
    }

    /* A small styled label stands in for a native tooltip (hover on desktop, a brief tap on touch). */
    .octo-wip-label {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translate(-50%, -6px);
      white-space: nowrap;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.68rem;
      color: #9eb2bd;
      background: rgba(8, 18, 20, 0.92);
      border: 1px solid rgba(158, 178, 189, 0.4);
      padding: 6px 12px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .octo-menu-item.is-disabled:hover .octo-wip-label,
    .octo-menu-item.is-disabled:focus-visible .octo-wip-label,
    .octo-menu-item.is-disabled.is-tapped .octo-wip-label {
      opacity: 1;
      transform: translate(-50%, -12px);
    }
    @media (prefers-reduced-motion: reduce) {
      .octo-wip-label { transition: none; }
    }
  </style>
</head>
<body>

  <div class="octo-loading" id="octoLoading" aria-hidden="true">
    <div class="octo-spinner"></div>
  </div>

  <div class="octo-scene-wrap" id="octoSceneWrap" aria-hidden="true">
    <canvas class="octo-canvas" id="octoCanvas"></canvas>
  </div>

  <div class="octo-menu-wrap">
    <p class="octo-title">Octomancer</p>
    <nav class="octo-menu" aria-label="Octomancer menu">
      <button type="button" class="octo-menu-item is-disabled" id="octoStartGame" aria-disabled="true">
        Start Game
        <span class="octo-wip-label" role="status">Work in progress</span>
      </button>
      <a class="octo-menu-item" href="/octomancer/archive/">Information</a>
      <a class="octo-menu-item" href="/">Exit</a>
    </nav>
  </div>

  <script>
    // Escape leaves the title screen, same as backing out of a game's main menu.
    (function () {
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          window.location.href = '/';
        }
      });
    })();

    // Start Game is disabled (no browser build yet). Hover/focus already reveals its "Work in
    // progress" label via CSS; touch devices have no hover, so a tap reveals it briefly instead.
    (function () {
      var startBtn = document.getElementById('octoStartGame');
      if (!startBtn) return;
      var hideTimer = null;
      startBtn.addEventListener('click', function () {
        startBtn.classList.add('is-tapped');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
          startBtn.classList.remove('is-tapped');
        }, 1600);
      });
    })();

    // The cave scene: five pre-combined depth groups of Milan's art drawn into one canvas.
    // Nearer groups follow the mouse more (depth grows with the square of the original layer index);
    // without a mouse, or after a few idle seconds, the scene sways gently. Every input is validated,
    // so a zero-sized window (e.g. mid fullscreen switch) or a missing pointer can't produce NaN.
    (function () {
      var canvas = document.getElementById('octoCanvas');
      var ctx = canvas.getContext('2d');
      var sceneWrap = document.getElementById('octoSceneWrap');
      var loading = document.getElementById('octoLoading');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Group -> representative original layer index (1..20); depth = (index / 20)^2.
      var GROUPS = [['group-1', 4], ['group-2', 9], ['group-3', 13.5], ['group-4', 17.5], ['group-5', 20]];
      var MAX_X = 60, MAX_Y = 35;   // px the front group moves at the screen edge
      var IDLE_AFTER = 4000;         // ms without mouse movement before the idle sway takes over
      var ART_RATIO = 16 / 9;

      var layers = GROUPS.map(function (g) {
        var img = new Image();
        img.decoding = 'async';
        img.src = '/img/octomancer/menu/' + g[0] + '.webp';
        return { img: img, depth: Math.pow(g[1] / 20, 2) };
      });

      var target = { x: 0, y: 0 }, current = { x: 0, y: 0 }, drawn = { x: NaN, y: NaN };
      var lastPointer = -Infinity, needsResize = true, ready = false;
      var view = { w: 0, h: 0, dpr: 1 };

      function clamp(v) { return v < -1 ? -1 : v > 1 ? 1 : v; }

      function resize() {
        var w = window.innerWidth, h = window.innerHeight;
        if (!(w > 0 && h > 0)) return false;           // mid fullscreen switch: try again next frame
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        view = { w: w, h: h, dpr: dpr };
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        needsResize = false;
        drawn.x = NaN;                                  // force a redraw
        return true;
      }

      // Same framing as the original page: 2560px wide on desktop, 2000px on phones, never smaller
      // than the screen plus the parallax travel, so no edge ever shows.
      function sceneSize() {
        var base = view.w >= 960 ? 2560 : 2000;
        var w = Math.max(base, view.w + 2 * MAX_X + 8, (view.h + 2 * MAX_Y + 8) * ART_RATIO);
        return { w: w, h: w / ART_RATIO };
      }

      function draw() {
        var s = sceneSize();
        var d = view.dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = 'rgb(8, 18, 20)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (var i = 0; i < layers.length; i++) {
          var l = layers[i];
          var x = (view.w - s.w) / 2 - current.x * l.depth * MAX_X;
          var y = (view.h - s.h) / 2 - current.y * l.depth * MAX_Y;
          ctx.drawImage(l.img, x * d, y * d, s.w * d, s.h * d);
        }
        drawn.x = current.x;
        drawn.y = current.y;
      }

      window.addEventListener('resize', function () { needsResize = true; });
      window.addEventListener('pointermove', function (event) {
        if (event.pointerType !== 'mouse') return;
        var w = window.innerWidth, h = window.innerHeight;
        if (!(w > 0 && h > 0) || !isFinite(event.clientX) || !isFinite(event.clientY)) return;
        target.x = clamp((event.clientX / w) * 2 - 1);
        target.y = clamp((event.clientY / h) * 2 - 1);
        lastPointer = performance.now();
      });

      function frame(now) {
        if (needsResize && !resize()) { requestAnimationFrame(frame); return; }
        if (!reduceMotion) {
          if (now - lastPointer > IDLE_AFTER) {
            target.x = Math.sin(now * 0.00017) * 0.6;
            target.y = Math.sin(now * 0.00023 + 1.3) * 0.6;
          }
          current.x += (target.x - current.x) * 0.06;
          current.y += (target.y - current.y) * 0.06;
        }
        // Only redraw when the scene actually moved (or after a resize).
        if (!(Math.abs(current.x - drawn.x) < 0.0005 && Math.abs(current.y - drawn.y) < 0.0005)) draw();
        requestAnimationFrame(frame);
      }

      function reveal() {
        if (ready) return;
        ready = true;
        sceneWrap.classList.add('is-ready');
        if (loading) loading.classList.add('is-hidden');
      }

      Promise.all(layers.map(function (l) {
        return l.img.decode ? l.img.decode().catch(function () {}) : new Promise(function (res) {
          l.img.onload = l.img.onerror = res;
        });
      })).then(start);

      // Safety net: never leave the player staring at the spinner if something stalls.
      setTimeout(start, 4000);

      var started = false;
      function start() {
        if (started) return;
        started = true;
        requestAnimationFrame(function (t) { frame(t); reveal(); });
      }
    })();
  </script>
</body>
</html>
