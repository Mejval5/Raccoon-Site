<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octomancer | Raccoon Website</title>
  <meta name="description" content="The Octomancer title screen: start the archived 2021 underwater arcade/platformer, or head back to the games list.">
  <meta property="og:title" content="Octomancer">
  <meta property="og:description" content="The Octomancer title screen: start the archived 2021 underwater arcade/platformer, or head back to the games list.">
  <meta property="og:image" content="https://raccoon.website/img/octomancer/hero.webp">
  <meta property="og:url" content="https://raccoon.website/octomancer/">
  <meta property="og:type" content="website">
  <link rel="icon" href="/racc-light.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans&family=Quicksand:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    /* Octomancer's own title screen: Milan Švancara's layered cave art, drifting, behind a two-item menu. */
    html, body {
      height: 100%;
      overflow: hidden;
      background: rgba(8, 18, 20, 1);
    }
    body {
      height: 100dvh;
    }

    /* ---------- Parallax scene ---------- */

    .octo-scene-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: rgba(8, 18, 20, 1);
      z-index: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .octo-scene-wrap.is-ready { opacity: 1; }

    /* At least 150% of the viewport width like the original menu, so the cave opening fills the view,
       and never smaller than a cover fit, so no edges show at any aspect ratio (all layers are 16:9).
       No will-change on the layers: forcing 22 full-screen GPU layers broke compositing in Chromium. */
    .octo-scene {
      position: absolute;
      top: 50%;
      left: 50%;
      width: max(150vw, 177.78vh);
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
    }

    .octo-layer { position: absolute; inset: 0; }
    .octo-layer img { display: block; width: 100%; height: 100%; }

    /* The overlay layer renders slightly oversized, matching the original mainMenu.vue. */
    .octo-layer-overlay img { width: 120%; height: 120%; margin: -10% 0 0 -10%; }

    /* A huge outline hides the gap this layer's drift would otherwise expose at the scene edges. */
    .octo-layer-mask { outline: 1000px solid rgba(8, 18, 20, 1); }

    @media (min-width: 1264px) {
      @media (prefers-reduced-motion: no-preference) {
        .octo-layer {
          transition: transform 12s ease-in-out;
        }
      }
    }

    /* ---------- Loading veil ---------- */

    .octo-loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: rgba(8, 18, 20, 1);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .octo-loading.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .octo-spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(209, 218, 223, 0.25);
      border-top-color: #d1dadf;
      animation: octo-spin 0.9s linear infinite;
    }
    @keyframes octo-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .octo-spinner { animation-duration: 1.8s; }
    }

    /* ---------- Menu ---------- */

    .octo-menu-wrap {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
    }

    .octo-title {
      font-family: 'Josefin Sans', var(--font-head, sans-serif);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #d1dadf;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      margin: 0 0 12px;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
      opacity: 0.92;
    }

    .octo-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px 44px;
    }

    .octo-menu-item {
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: max(min(max(3vh, 3vw), 25px), 15px);
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      transition: text-shadow 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .octo-menu-item:hover,
    .octo-menu-item:focus-visible {
      color: #d1dadf;
      text-decoration: none;
      text-shadow: 0 0 18px rgba(158, 178, 189, 0.85), 0 0 36px rgba(158, 178, 189, 0.5);
      transform: scale(1.05);
    }
    .octo-menu-item:focus-visible {
      outline: 2px solid #9eb2bd;
      outline-offset: 6px;
    }
    .octo-menu-item:active { transform: scale(0.98); }

    .octo-menu-item.is-disabled {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }
    .octo-menu-item.is-disabled:hover,
    .octo-menu-item.is-disabled:focus-visible {
      color: #fff;
      text-shadow: none;
      transform: none;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="octo-loading" id="octoLoading" aria-hidden="true">
    <div class="octo-spinner"></div>
  </div>

  <div class="octo-scene-wrap" id="octoSceneWrap" aria-hidden="true">
    <div class="octo-scene" id="octoScene">
      <div class="octo-layer" id="bg1"><img src="/img/octomancer/menu/01.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg2"><img src="/img/octomancer/menu/02.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg3"><img src="/img/octomancer/menu/03.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg4"><img src="/img/octomancer/menu/04.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg5"><img src="/img/octomancer/menu/05.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg6"><img src="/img/octomancer/menu/06.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg7"><img src="/img/octomancer/menu/07.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg8"><img src="/img/octomancer/menu/08.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg9"><img src="/img/octomancer/menu/09.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg10"><img src="/img/octomancer/menu/10.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg11"><img src="/img/octomancer/menu/11.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg12"><img src="/img/octomancer/menu/12.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg13"><img src="/img/octomancer/menu/13.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg14"><img src="/img/octomancer/menu/14.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg15"><img src="/img/octomancer/menu/15.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg16"><img src="/img/octomancer/menu/16.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg17"><img src="/img/octomancer/menu/17.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg18"><img src="/img/octomancer/menu/18.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg19"><img src="/img/octomancer/menu/19.webp" alt="" decoding="async"></div>
      <div class="octo-layer octo-layer-overlay" id="bg20"><img src="/img/octomancer/menu/20-overlay.webp" alt="" decoding="async"></div>
      <div class="octo-layer octo-layer-mask" id="bg21"><img src="/img/octomancer/menu/20.webp" alt="" decoding="async"></div>
      <div class="octo-layer" id="bg22"><img src="/img/octomancer/menu/light.webp" alt="" decoding="async"></div>
    </div>
  </div>

  <div class="octo-menu-wrap">
    <p class="octo-title">Octomancer</p>
    <nav class="octo-menu" aria-label="Octomancer menu">
      <span class="octo-menu-item is-disabled" aria-disabled="true" title="Coming soon">Start Game</span>
      <a class="octo-menu-item" href="/octomancer/archive/">Information</a>
      <a class="octo-menu-item" href="/">Exit</a>
    </nav>
  </div>

  <script>
    // Fade the scene in once every layer is downloaded AND decoded, so no half-painted layers flash.
    (function () {
      var loading = document.getElementById('octoLoading');
      var sceneWrap = document.getElementById('octoSceneWrap');
      var imgs = Array.prototype.slice.call(sceneWrap.querySelectorAll('img'));
      var done = false;

      function reveal() {
        if (done) return;
        done = true;
        sceneWrap.classList.add('is-ready');
        if (loading) loading.classList.add('is-hidden');
      }

      function ready(img) {
        if (img.decode) return img.decode().catch(function () {});
        if (img.complete) return Promise.resolve();
        return new Promise(function (resolve) {
          img.addEventListener('load', resolve, { once: true });
          img.addEventListener('error', resolve, { once: true });
        });
      }

      Promise.all(imgs.map(ready)).then(reveal);

      // Safety net: never leave the player staring at the spinner if something stalls.
      setTimeout(reveal, 4000);
    })();

    // Escape leaves the title screen, same as backing out of a game's main menu.
    (function () {
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          window.location.href = '/';
        }
      });
    })();

    // Slow dreamy drift of the cave-art layers: desktop only, paused off-screen, skipped for
    // reduced motion. Ports mainMenu.vue's danparallax.js (Perlin noise) to a simple smoothed
    // random walk, keeping the same per-layer formula, timing and 12s CSS transition.
    (function () {
      var desktopQuery = window.matchMedia('(min-width: 1264px)');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return;

      var layers = [];
      for (var i = 1; i <= 22; i++) {
        layers[i] = document.getElementById('bg' + i);
      }

      function depthFor(i) {
        return (i >= 20 && i <= 22) ? 20 : i;
      }

      var timer = null;
      var running = false;
      var hidden = document.hidden;

      function tick() {
        if (!hidden && desktopQuery.matches) {
          var angle = Math.random() * Math.PI * 2;
          var r = (Math.random() * 2 - 1) * 300;
          for (var i = 1; i <= 22; i++) {
            var d = depthFor(i);
            var x = Math.round(Math.cos(angle) * r * d * d / 500);
            var y = Math.round(Math.sin(angle) * r * d * d / 500);
            if (layers[i]) layers[i].style.transform = 'translate(' + x + 'px,' + y + 'px)';
          }
        }
        schedule();
      }

      function schedule() {
        var wait = (Math.random() * 6 + 3) * 1000; // 3-9s, matching the original's timing
        timer = setTimeout(tick, wait);
      }

      function start() {
        if (running) return;
        running = true;
        schedule();
      }

      function stop() {
        running = false;
        if (timer) clearTimeout(timer);
        timer = null;
      }

      document.addEventListener('visibilitychange', function () {
        hidden = document.hidden;
      });

      desktopQuery.addEventListener('change', function (event) {
        if (event.matches) start(); else stop();
      });

      if (desktopQuery.matches) start();
    })();
  </script>
</body>
</html>
