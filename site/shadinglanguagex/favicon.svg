  <defs>
    <radialGradient id="ball" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".28" stop-color="#e3b341"/>
      <stop offset=".62" stop-color="#c2552f"/>
      <stop offset="1" stop-color="#3a1630"/>
    </radialGradient>
    <radialGradient id="rim" cx="72%" cy="80%" r="45%">
      <stop offset="0" stop-color="#5fb4ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#5fb4ff" stop-opacity="0"/>
